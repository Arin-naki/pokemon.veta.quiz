<head>

  <style>
    :root {
      color-scheme: light;
      --ink: #17201c;
      --ink-soft: #3e4943;
      --muted: #707a74;
      --line: #dfe3de;
      --line-soft: #eceeea;
      --paper: #fffef9;
      --sidebar: #f1f1ea;
      --panel-soft: #f5f3ed;
      --coral: #e45c51;
      --coral-soft: #fff0eb;
      --green: #2f5b49;
      font-family: Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle 320px at 88% 8%, #fceee7 0, transparent 75%), var(--paper); }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible { outline: 3px solid rgba(47, 91, 73, .35); outline-offset: 2px; }
    .shell { width: min(100%, 760px); min-height: 100vh; margin: auto; padding: 26px 22px 34px; display: flex; flex-direction: column; gap: 18px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 0 20px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .brand-ball { position: relative; display: inline-block; flex: 0 0 auto; width: 32px; height: 32px; overflow: hidden; border: 3px solid var(--ink); border-radius: 50%; background: linear-gradient(var(--coral) 0 45%, var(--ink) 45% 55%, #fff 55%); }
    .brand-ball::after { position: absolute; inset: 9px; content: ''; border: 2px solid var(--ink); border-radius: 50%; background: #fff; }
    h1 { margin: 0; font-size: clamp(20px, 4vw, 26px); line-height: 1.15; font-weight: 800; letter-spacing: -.04em; }
    /* veta 사이트(arin-naki.github.io/pokemon.veta)의 .veta-credit 계산값을 그대로 옮김 */
    .veta-credit { display: block; margin: 0 0 0 1px; color: #aeb3af; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 6px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
    .veta-credit b { color: #c77d76; font-weight: 800; }
    .count { flex: 0 0 auto; padding: 7px 11px; border: 1px solid #edccc6; border-radius: 999px; color: #a34f47; background: #fff8f5; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .settings { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }  /* 문제 유형 칸을 넓게, 출제 범위 칸을 좁게 */
    .setting-block { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.82); }
    .setting-label { display: block; margin: 0 0 9px 2px; color: var(--muted); font-size: 11px; font-weight: 750; }
    .group { display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: var(--sidebar); }
    .group button { flex: 1; min-width: 0; min-height: 36px; padding: 7px 5px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 750; }
    .group button:hover { color: var(--green); }
    .group button[aria-pressed="true"] { color: var(--green); background: #fff; box-shadow: 0 2px 7px rgba(42, 63, 52, .09); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { min-width: 0; padding: 10px 8px; border: 1px solid var(--line-soft); border-radius: 11px; background: var(--panel-soft); text-align: center; }
    .stat strong { display: block; color: var(--ink); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 650; }
    /* 기록 초기화: PC는 푸터 오른쪽 끝, 좁은 화면은 푸터 맨 아래 가운데 */
    .reset { position: absolute; right: 0; top: 50%; transform: translateY(-50%); height: 26px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sidebar); color: var(--ink-soft); font-size: 11px; font-weight: 800; box-shadow: 0 2px 6px rgba(35,52,43,.06); transition: background .15s, color .15s, border-color .15s; }
    .reset:hover { border-color: #e8a49c; color: #c54e46; background: var(--coral-soft); }
    .card { flex: 1; min-height: 470px; padding: 25px 26px 24px; display: flex; flex-direction: column; border: 1px solid #e8e7e1; border-radius: 18px; color: var(--ink); background: radial-gradient(circle 210px at 100% 0, rgba(240,105,88,.08), transparent 72%), #fff; box-shadow: 0 14px 35px rgba(35,52,43,.07); }
    .eyebrow { color: var(--coral); font-size: 10px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    h2 { margin: 8px 0 5px; font-size: clamp(23px, 5vw, 29px); font-weight: 800; letter-spacing: -.045em; }
    .source-note { min-height: 17px; margin: 0; color: var(--muted); font-size: 11px; }
    .timer { display: flex; align-items: center; justify-content: space-between; margin-top: 21px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .timer strong { color: var(--green); font-size: 17px; font-variant-numeric: tabular-nums; }
    .timer.low strong { color: #c54e46; }
    .timer-track { height: 6px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: #ebece6; }
    .timer-fill { width: 100%; height: 100%; border-radius: inherit; background: var(--green); transition: width .1s linear; }
    .timer.low + .timer-track .timer-fill { background: var(--coral); }
    .clues { height: 122px; margin-top: 19px; padding: 16px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 9px; border: 1px solid var(--line-soft); border-radius: 13px; background: #fbfaf6; }
    .badge { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft); background: #fff; font-size: 18px; font-weight: 800; }
    .badge.type { min-width: 110px; gap: 7px; border-color: transparent; color: #fff; background: var(--type-color, #69736d); font-size: 18px; }
    .badge.type.small { min-width: 0; padding: 4px 8px; gap: 4px; font-size: 11px; }
    .type-icon { width: 26px; height: 26px; flex: none; object-fit: contain; }
    .badge.type.small .type-icon { width: 17px; height: 17px; }
    .badge.ability { border-color: var(--ink-soft); color: #fff; background: var(--ink-soft); }
    .badge.move { border-color: var(--line); color: var(--ink-soft); background: var(--panel-soft); }
    .instruction { margin: 20px 0 10px; color: var(--ink-soft); font-size: 13px; font-weight: 750; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }
    .choice { position: relative; min-height: 150px; padding: 12px 10px 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 13px; color: var(--ink); background: #fff; text-align: center; font-size: 16px; font-weight: 750; transition: border-color .15s, background .15s, transform .15s; }
    .choice:not(:disabled):hover { border-color: #aabfb2; background: #f7faf6; }
    .choice-art { position: relative; width: 92px; height: 92px; flex: none; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: var(--panel-soft); }
    .choice-art img { width: 86px; height: 86px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(35,52,43,.12)); transition: opacity .25s; }
    /* 답하기 전 가림: 그림은 숨기고 흐릿한 포켓볼을 그린다 */
    .choice-art.covered img { opacity: 0; }
    .choice-art.covered::before { content: ''; position: absolute; width: 56px; height: 56px; background: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dream-world/premier-ball.png') center / contain no-repeat; opacity: .5; filter: grayscale(1); }
    .choice-art.missing::after { content: '?'; color: var(--muted); font-size: 28px; font-weight: 800; }
    .choice-name { line-height: 1.2; }
    .choice.correct { border-color: #7eaa8a; color: #255841; background: #eaf4ed; }
    .choice.wrong { border-color: #e8a49c; color: #a0473f; background: var(--coral-soft); }
    .choice:disabled { cursor: default; }
    .choice:disabled:not(.correct):not(.wrong) { color: var(--muted); border-color: var(--line-soft); }
    .choice:disabled:not(.correct):not(.wrong) .choice-art img { opacity: .55; filter: grayscale(.4); }
    .choice-mark { position: absolute; z-index: 1; top: 8px; left: 8px; padding: 4px 10px; border-radius: 999px; color: #fff; background: var(--green); font-size: 12px; font-weight: 850; letter-spacing: .04em; box-shadow: 0 2px 6px rgba(35,52,43,.18); }
    .choice.wrong .choice-mark { background: var(--coral); }
    .choice-side { position: absolute; top: 34px; bottom: 10px; max-width: calc(50% - 52px); display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .choice-side.left { left: 9px; align-items: flex-start; }
    .choice-side.right { right: 9px; align-items: flex-end; text-align: right; }
    .choice-side.right .side-types, .side-text { display: none; }
    .choice-side .badge.type.small { padding: 3px; }
    .choice-side .badge.type.small span { display: none; }
    .choice-side.right .side-ability, .choice-side.right .side-move { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .side-ability { color: var(--ink-soft); font-size: 11px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
    .side-ability::before { content: '특성 '; color: var(--ink-soft); font-weight: 750; }
    .side-move { color: var(--ink-soft); font-size: 11px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
    .start-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
    .start-panel h2 { margin: 0; }
    .start-panel p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .start-panel .next { width: min(100%, 320px); margin-top: 14px; }
    .card.idle > :not(.start-panel) { display: none; }
    .card:not(.idle) > .start-panel { display: none; }
    .next { width: 100%; min-height: 49px; margin-top: auto; border: 0; border-radius: 10px; color: #fff; background: var(--coral); font-size: 14px; font-weight: 800; box-shadow: 0 6px 16px rgba(228,92,81,.18); }
    .next:hover:not(:disabled) { background: #cb4e44; }
    .next:disabled { opacity: .48; cursor: default; box-shadow: none; }
    footer { position: relative; padding: 0 90px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.6; }
    /* PC(1000px 이상): 왼쪽에 설정·기록, 오른쪽에 퀴즈 카드 — 카드가 한 화면에 들어오게. 그보다 좁으면 세로 쌓기 그대로. */
    @media (min-width: 1000px) {
      .shell { width: min(100%, 1120px); padding-top: 18px; display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto auto auto 1fr auto; grid-template-areas: "header header" "settings card" "stats card" "spacer card" "footer footer"; gap: 16px 22px; align-items: start; }
      header { grid-area: header; }
      .settings { grid-area: settings; grid-template-columns: 1fr; gap: 10px; }
      .group { flex-direction: column; }
      .group button { min-height: 34px; }
      .stats { grid-area: stats; grid-template-columns: 1fr 1fr; }
      .card { grid-area: card; padding: 20px 24px 20px; }
      footer { grid-area: footer; }
      .timer { margin-top: 14px; }
      .clues { height: 90px; margin-top: 14px; }
      .instruction { margin: 14px 0 8px; }
    }
    @media (max-width: 560px) {
      .shell { padding: 18px 13px 25px; gap: 13px; }
      header { padding-bottom: 15px; }
      .brand-ball { width: 27px; height: 27px; }
      .brand-ball::after { inset: 7px; }
      .count { padding: 6px 8px; font-size: 10px; }
      .settings { grid-template-columns: 1fr; gap: 8px; }
      .setting-block { padding: 9px 10px; }
      .setting-label { margin-bottom: 6px; }
      .stat { padding: 8px 5px; }
      .card { min-height: 460px; padding: 21px 16px 17px; }
      .clues { height: 105px; padding: 12px; gap: 8px; }
      .badge { padding: 8px 13px; font-size: 15px; }
      .badge.ability .ability-label { display: none; }
      .choice { min-height: 150px; padding: 11px 8px; font-size: 15px; }
      footer { padding: 0 0 30px; }
      .reset { top: auto; bottom: 0; right: 50%; transform: translateX(50%); }
      .choice-art { width: 80px; height: 80px; }
      .choice-art img { width: 74px; height: 74px; }
      .choice-art.covered::before { width: 48px; height: 48px; }
      /* 좁은 화면: 타입 아이콘은 왼쪽 세로(데스크톱과 동일), 이름 아래엔 "특성 A · B · C" 글자 한 줄(길면 두 줄). 그림 크기·카드 높이는 그대로. */
      .choice-side.right { display: contents; }
      .choice-side.right .side-types, .choice-side.right .side-ability, .choice-side.right .side-move { display: none; }
      .side-text { display: block; max-width: 100%; margin-top: 2px; color: var(--ink-soft); font-size: 10px; font-weight: 500; line-height: 1.3; text-align: center; }
      .side-text.placeholder { visibility: hidden; }
      .choice-art, .choice-name { transition: transform .3s ease; }
      .choice:not(.correct) .choice-art, .choice:not(.correct) .choice-name { transform: translateY(var(--reserve-shift, 10px)); }
      .choice.correct .side-text { animation: side-text-in .3s ease; }
      @keyframes side-text-in { from { opacity: 0; } to { opacity: 1; } }
      .side-text .side-label { margin-right: 3px; color: var(--ink-soft); font-weight: 750; }
      .side-text .side-dot { margin: 0 3px; color: #9fb5a6; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-ball" aria-hidden="true"></span><h1>포켓몬 무한 퀴즈</h1><small class="veta-credit" aria-hidden="true">INSPIRED BY <b>VETA</b></small></div>
      <div class="count" id="pool-count"></div>
    </header>

    <section class="settings" aria-label="퀴즈 설정">
      <div class="setting-block">
        <span class="setting-label">문제 유형</span>
        <div class="group" id="mode-group" aria-label="문제 유형">
          <button type="button" data-mode="mixed" aria-pressed="true">섞어서</button>
          <button type="button" data-mode="type" aria-pressed="false">타입</button>
          <button type="button" data-mode="clue" aria-pressed="false">기술·특성</button>
        </div>
      </div>
      <div class="setting-block">
        <span class="setting-label">출제 범위</span>
        <div class="group" id="scope-group" aria-label="출제 범위">
          <button type="button" data-scope="all" aria-pressed="true">전국도감</button>
          <button type="button" data-scope="champions" aria-pressed="false">챔피언즈</button>
        </div>
      </div>
    </section>

    <section class="stats" aria-label="플레이 기록">
      <div class="stat"><strong id="stat-correct">0</strong><span>정답</span></div>
      <div class="stat"><strong id="stat-total">0</strong><span>푼 문제</span></div>
      <div class="stat"><strong id="stat-streak">0</strong><span>연속 정답</span></div>
      <div class="stat"><strong id="stat-best">0</strong><span>최고 연속</span></div>
    </section>

    <section class="card idle" id="card" aria-live="polite">
      <div class="start-panel" id="start-panel">
        <div class="eyebrow">READY?</div>
        <h2 id="start-title">준비됐으면 시작!</h2>
        <p id="start-desc">위에서 문제 유형과 출제 범위를 고른 뒤 시작해요.<br>한 문제당 5초, 보기 그림을 눌러 답합니다.</p>
        <button class="next" id="start" type="button">시작하기</button>
      </div>
      <div class="eyebrow" id="kind"></div>
      <h2 id="question-title"></h2>
      <p class="source-note" id="source-note"></p>
      <div class="timer" id="timer" role="timer"><span>남은 시간</span><strong id="seconds">5초</strong></div>
      <div class="timer-track" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="clues" id="clues"></div>
      <p class="instruction">다음 중 조건에 맞는 포켓몬은?</p>
      <div class="choices" id="choices"></div>
      <button class="next" id="next" type="button" disabled>정답을 골라줘!</button>
    </section>

  <script>
    (() => {
      const rawData = document.getElementById('quiz-data').textContent;
      if (rawData.trim() === '__QUIZ_DATA__') {
        document.querySelector('.card').innerHTML = '<h2>이 파일은 제작용 템플릿이에요</h2><p>퀴즈 데이터가 들어 있는 완성본을 열어주세요.</p><p><a href="./index.html">포켓몬 무한 퀴즈 열기 →</a></p>';
        return;
      }
      const db = JSON.parse(rawData);
      const champions = new Set(db.champions);
      const $ = id => document.getElementById(id);
      const shuffled = array => {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };
      const random = array => array[Math.floor(Math.random() * array.length)];
      const saved = (() => { try { return JSON.parse(localStorage.getItem('pokemon-quiz-stats') || '{}'); } catch { return {}; } })();
      const stats = { correct: saved.correct || 0, total: saved.total || 0, streak: saved.streak || 0, best: saved.best || 0 };
      let mode = 'mixed';
      let scope = 'all';
      let question = null;
      let answered = false;
      let started = false;
      let pending = null;
      let recent = [];
      const timeLimitMs = 5000;
      // 퀴즈 도중 문제 유형·출제 범위를 바꾸면 바로 출제하지 않고 시작 화면으로 돌아간다.
      // 예전처럼 즉시 출제하게 되돌리려면 false로 바꾸면 된다.
      const restartOnSettingChange = true;
      // 답하기 전까지 보기 그림을 포켓볼로 가릴 문제 유형.
      // 가리는 이유: 그림이 보이면 너무 쉬움. 나중에 난이도를 나누면 낮은 난이도에서는 type을 false로 해 그림을 다시 보여줄 계획.
      const coverArtUntilAnswered = { type: true, clue: false };
      let timerId = null;
      let timerDeadline = 0;
      const typeVisual = db.typeVisuals;

      function stopTimer() {
        if (timerId !== null) clearInterval(timerId);
        timerId = null;
      }
      function showTime(remainingMs) {
        const remaining = Math.max(0, remainingMs);
        $('seconds').textContent = `${Math.ceil(remaining / 1000)}초`;
        $('timer-fill').style.width = `${remaining / timeLimitMs * 100}%`;
        $('timer').classList.toggle('low', remaining <= 2000);
      }
      function startTimer() {
        stopTimer();
        timerDeadline = performance.now() + timeLimitMs;
        showTime(timeLimitMs);
        timerId = setInterval(() => {
          const remaining = Math.max(0, timerDeadline - performance.now());
          showTime(remaining);
          if (remaining === 0) answer(null);
        }, 100);
      }

      function pool() { return db.species.filter(p => scope === 'all' || champions.has(p.n)); }
      function game() { return scope === 'champions' ? 'champions' : 'sv'; }
      function typeKey(p) { return [...p.types].sort((a, b) => a - b).join('-'); }
      function chooseTarget(candidates) {
        const fresh = candidates.filter(p => !recent.includes(p.n));
        const target = random(fresh.length ? fresh : candidates);
        recent.push(target.n);
        if (recent.length > 35) recent.shift();
        return target;
      }
      function makeTypeQuestion(candidates) {
        const target = chooseTarget(candidates);
        const key = typeKey(target);
        const distractors = shuffled(candidates.filter(p => typeKey(p) !== key)).slice(0, 3);
        return { kind: 'type', target, options: shuffled([target, ...distractors]), types: target.types };
      }
      function makeClueQuestion(candidates) {
        const group = game();
        const eligible = candidates.filter(p => p.moves[group].length >= 8 && p.abilities.length);
        if (eligible.length < 4) return makeTypeQuestion(candidates);
        const target = chooseTarget(eligible);
        const ability = random(target.abilities.filter(id => db.abilities[id]));
        const counts = new Map();
        for (const p of eligible) for (const id of p.moves[group]) counts.set(id, (counts.get(id) || 0) + 1);
        const possible = shuffled(target.moves[group].filter(id => db.moves[id]));
        possible.sort((a, b) => (counts.get(a) || 0) - (counts.get(b) || 0));
        const rare = random(possible.slice(0, Math.min(20, possible.length)));
        const others = shuffled(possible.filter(id => id !== rare && (counts.get(id) || 0) < eligible.length * .65)).slice(0, 2);
        const moves = [rare, ...others];
        if (moves.length < 3) return makeTypeQuestion(candidates);
        const falseOptions = candidates.filter(p =>
          p.n !== target.n && !(p.abilities.includes(ability) && moves.every(id => p.moves[group].includes(id)))
        );
        falseOptions.sort((a, b) => {
          const score = p => (p.abilities.includes(ability) ? 4 : 0) + moves.filter(id => p.moves[group].includes(id)).length;
          return score(b) - score(a) || Math.random() - .5;
        });
        const distractors = shuffled(falseOptions.slice(0, Math.min(35, falseOptions.length))).slice(0, 3);
        return { kind: 'clue', target, options: shuffled([target, ...distractors]), ability, moves, group };
      }
      function badge(label, className) {
        const node = document.createElement('span');
        node.className = `badge ${className}`;
        node.textContent = label;
        return node;
      }
      function typeBadge(id, small = false) {
        const visual = typeVisual[id];
        const node = document.createElement('span');
        node.className = `badge type${small ? ' small' : ''}`;
        node.style.setProperty('--type-color', visual?.color || '#69736d');
        const icon = document.createElement('img');
        icon.className = 'type-icon';
        icon.alt = '';
        icon.src = visual?.icon || '';
        const label = document.createElement('span');
        label.textContent = db.types[id] || '알 수 없음';
        node.append(icon, label);
        return node;
      }
      function updateStats() {
        for (const key of Object.keys(stats)) $('stat-' + key).textContent = stats[key];
        try { localStorage.setItem('pokemon-quiz-stats', JSON.stringify(stats)); } catch {}
      }
      function nextQuestion() {
        stopTimer();
        const ready = pending && pending.mode === mode && pending.scope === scope ? pending : makeQuestion();
        pending = null;
        const candidates = ready.candidates;
        question = ready.question;
        answered = false;
        $('pool-count').textContent = `${candidates.length.toLocaleString('ko-KR')}종 출제`;
        $('kind').textContent = question.kind === 'type' ? 'TYPE QUIZ' : 'MOVE & ABILITY QUIZ';
        $('question-title').textContent = question.kind === 'type' ? '타입으로 맞히기' : '기술·특성으로 맞히기';
        $('source-note').textContent = question.kind === 'clue'
          ? `${scope === 'champions' ? '포켓몬 챔피언즈' : '스칼렛·바이올렛'} 습득 기술 기준`
          : '기본 모습의 타입 기준';
        const clues = $('clues');
        clues.replaceChildren();
        if (question.kind === 'type') {
          question.types.forEach(id => clues.append(typeBadge(id)));
        } else {
          const abilityChip = badge(db.abilities[question.ability], 'ability');
          const abilityLabel = document.createElement('span');
          abilityLabel.className = 'ability-label';
          abilityLabel.textContent = '특성 · ';
          abilityChip.prepend(abilityLabel);
          clues.append(abilityChip);
          question.moves.forEach(id => clues.append(badge(db.moves[id], 'move')));
        }
        const choices = $('choices');
        choices.replaceChildren();
        question.options.forEach(p => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'choice';
          const art = document.createElement('span');
          art.className = coverArtUntilAnswered[question.kind] ? 'choice-art covered' : 'choice-art';
          if (p.image) {
            const img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            img.src = p.image;
            img.onerror = () => { img.remove(); art.classList.add('missing'); };
            art.append(img);
          } else art.classList.add('missing');
          const name = document.createElement('span');
          name.className = 'choice-name';
          name.textContent = p.name;
          // 좁은 화면용 자리표시 "특성 · · ·": 정답 공개 때 실제 특성 줄로 바뀌며, 그림이 움직이지 않게 자리를 미리 차지한다.
          const placeholder = document.createElement('span');
          placeholder.className = 'side-text placeholder';
          const placeholderLabel = document.createElement('span');
          placeholderLabel.className = 'side-label';
          placeholderLabel.textContent = '특성';
          placeholder.append(placeholderLabel, document.createTextNode('· · ·'));
          button.append(art, name, placeholder);
          button.addEventListener('click', () => answer(p.n));
          choices.append(button);
        });
        $('next').textContent = '정답을 골라줘!';
        $('next').disabled = true;
        startTimer();
      }
      function makeQuestion() {
        const candidates = pool();
        const kind = mode === 'mixed' ? random(['type', 'clue']) : mode;
        return { candidates, question: kind === 'type' ? makeTypeQuestion(candidates) : makeClueQuestion(candidates) };
      }
      // 결과를 보는 동안 다음 문제를 미리 만들고 그림을 받아 둔다.
      function prepareNext() {
        pending = { mode, scope, ...makeQuestion() };
        pending.question.options.forEach(p => { if (p.image) { const img = new Image(); img.src = p.image; } });
      }
      function answer(selectedId) {
        if (answered || !question) return;
        const timedOut = selectedId === null || performance.now() >= timerDeadline;
        if (timedOut) selectedId = null;
        answered = true;
        stopTimer();
        if (timedOut) showTime(0);
        const correct = selectedId === question.target.n;
        stats.total++;
        if (correct) { stats.correct++; stats.streak++; stats.best = Math.max(stats.best, stats.streak); }
        else stats.streak = 0;
        updateStats();
        const mark = text => { const node = document.createElement('span'); node.className = 'choice-mark'; node.textContent = text; return node; };
        document.querySelectorAll('.choice-art.covered').forEach(node => node.classList.remove('covered'));
        [...$('choices').children].forEach((button, index) => {
          const p = question.options[index];
          button.disabled = true;
          if (p.n === question.target.n) {
            button.classList.add('correct');
            button.prepend(mark(timedOut ? '시간 초과' : '정답'));
            const side = (where, ...nodes) => { const node = document.createElement('span'); node.className = `choice-side ${where}`; node.append(...nodes); return node; };
            const text = (className, value) => { const node = document.createElement('span'); node.className = className; node.textContent = value; return node; };
            // 왼쪽 여백: 타입 아이콘. 오른쪽 여백: 특성(과 기술). 좁은 화면에선 왼쪽을 숨기고 오른쪽 열 맨 위에 타입을 넣는다.
            const typeRow = document.createElement('span');
            typeRow.className = 'side-types';
            typeRow.append(...p.types.map(id => typeBadge(id, true)));
            const abilityNames = question.kind === 'clue'
              ? [db.abilities[question.ability]]
              : p.abilities.filter(id => db.abilities[id]).map(id => db.abilities[id]);
            const details = question.kind === 'clue'
              ? [text('side-ability', abilityNames[0]), ...question.moves.map(id => text('side-move', db.moves[id]))]
              : abilityNames.map(name => text('side-ability', name));
            // 좁은 화면용 글자 줄: "특성 A · B · C"
            const line = document.createElement('span');
            line.className = 'side-text';
            line.append(text('side-label', '특성'));
            abilityNames.forEach((name, i) => { if (i) line.append(text('side-dot', '·')); line.append(document.createTextNode(name)); });
            button.classList.add(question.kind);
            button.querySelector('.side-text.placeholder')?.remove();
            button.append(side('left', ...p.types.map(id => typeBadge(id, true))));
            button.append(side('right', typeRow, ...details, line));
          } else if (p.n === selectedId) {
            button.classList.add('wrong');
            button.prepend(mark('아쉬워'));
          }
        });
        $('next').disabled = false;
        $('next').textContent = '다음 문제';
        $('next').focus({ preventScroll: true }); // 포커스 때문에 페이지가 스크롤되지 않게 (모바일 흔들림 방지)
        prepareNext();
      }
      function startQuiz() {
        started = true;
        $('card').classList.remove('idle');
        nextQuestion();
      }
      function settingsChanged() {
        pending = null;
        $('pool-count').textContent = `${pool().length.toLocaleString('ko-KR')}종 출제`;
        if (!started) return;
        if (!restartOnSettingChange) { nextQuestion(); return; }
        stopTimer();
        started = false;
        question = null;
        answered = false;
        $('start-title').textContent = '설정을 바꿨어요';
        $('start-desc').innerHTML = '준비되면 다시 시작해요.<br>지금까지의 기록은 그대로 이어집니다.';
        $('start').textContent = '다시 시작하기';
        $('card').classList.add('idle');
        $('start').focus({ preventScroll: true });
      }
      $('next').addEventListener('click', () => { if (answered) nextQuestion(); });
      $('mode-group').addEventListener('click', event => {
        const button = event.target.closest('[data-mode]');
        if (!button) return;
        mode = button.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach(el => el.setAttribute('aria-pressed', String(el === button)));
        settingsChanged();
      });
      $('scope-group').addEventListener('click', event => {
        const button = event.target.closest('[data-scope]');
        if (!button) return;
        scope = button.dataset.scope;
        document.querySelectorAll('[data-scope]').forEach(el => el.setAttribute('aria-pressed', String(el === button)));
        settingsChanged();
      });
      $('start').addEventListener('click', startQuiz);
      $('reset-stats').addEventListener('click', () => {
        if (!stats.total && !stats.best) return;
        if (!confirm('정답, 푼 문제, 연속 정답, 최고 연속 기록을 모두 0으로 되돌릴까요?')) return;
        for (const key of Object.keys(stats)) stats[key] = 0;
        updateStats();
      });
      document.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (!started) { if (event.key === 'Enter') { event.preventDefault(); startQuiz(); } return; }
        if (/^[1-4]$/.test(event.key) && !answered) {
          const option = question.options[Number(event.key) - 1];
          if (option) answer(option.n);
        } else if (event.key === 'Enter' && answered) {
          event.preventDefault();
          nextQuestion();
        }
      });
      updateStats();
      new Image().src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dream-world/premier-ball.png';
      $('pool-count').textContent = `${pool().length.toLocaleString('ko-KR')}종 출제`;
    })();
  </script>
</body>
</html>
